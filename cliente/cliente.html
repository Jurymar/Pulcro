<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Cliente - Pulcro</title>
    <link rel="stylesheet" href="cliente.css" />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Header -->
    <header class="header">
      <nav class="nav">
        <div class="logo">Pulcro</div>
        <div class="user-info">
          <div class="user-details">
            <span id="userEmail" class="user-email"></span>
            <span class="user-role">Cliente</span>
          </div>
          <button class="btn-logout" onclick="logout()">
            <i class="fas fa-sign-out-alt"></i>
            <span class="logout-text">Cerrar Sesión</span>
          </button>
        </div>
      </nav>
    </header>


    <!-- Main Content -->
    <main class="main-content">
      <!-- Dashboard Overview -->
      <section id="dashboard" class="section active">
        <!-- Welcome Section -->
        <div class="welcome-section">
          <h1>¡Bienvenido a Pulcro!</h1>
          <p>Tu lavandería digital está lista para cuidar tu ropa</p>
        </div>

        <!-- Quick Actions -->
        <div class="quick-actions">
          <h2 class="desktop-only">Acciones Rápidas</h2>
          <div class="action-buttons">
            <button class="action-btn primary" onclick="openNewOrderModal()">
              <i class="fas fa-plus"></i>
              <span class="desktop-only">Nuevo Pedido</span>
            </button>
            <button class="action-btn secondary desktop-only" onclick="showSection('active-orders')">
              <i class="fas fa-clock"></i>
              <span>Ver Activos</span>
            </button>
            <button class="action-btn secondary" onclick="showSection('order-history')">
              <i class="fas fa-history"></i>
              <span>Ver Historial</span>
            </button>
            <button class="action-btn secondary" onclick="showSection('profile')">
              <i class="fas fa-user"></i>
              <span>Mi Perfil</span>
            </button>
          </div>
        </div>

        <!-- Active Orders in Dashboard (Mobile) -->
        <div class="mobile-active-orders mobile-only">
          <h3>Pedidos Activos</h3>
          <div id="mobileActiveOrdersContainer" class="orders-container">
            <!-- Active orders will be loaded here for mobile -->
          </div>
        </div>
      </section>

      <!-- Active Orders Section -->
      <section id="active-orders" class="section">
        <div class="section-header">
          <h2>Pedidos Activos</h2>
          <button class="btn-back" onclick="showSection('dashboard')">
            <i class="fas fa-arrow-left"></i> Volver
          </button>
        </div>
        <div id="activeOrdersContainer" class="orders-container">
          <!-- Active orders will be loaded here -->
        </div>
      </section>

      <!-- Order History Section -->
      <section id="order-history" class="section">
        <div class="section-header">
          <h2>Historial de Pedidos</h2>
          <button class="btn-back" onclick="showSection('dashboard')">
            <i class="fas fa-arrow-left"></i> Volver
          </button>
        </div>
        <div class="history-filters">
          <button class="filter-btn active" onclick="filterOrders('all')">Todos</button>
          <button class="filter-btn" onclick="filterOrders('pending')">Pendientes</button>
          <button class="filter-btn" onclick="filterOrders('in-progress')">En Progreso</button>
          <button class="filter-btn" onclick="filterOrders('completed')">Completados</button>
          <button class="filter-btn" onclick="filterOrders('cancelled')">Cancelados</button>
        </div>
        <div id="orderHistoryContainer" class="orders-container">
          <!-- Order history will be loaded here -->
        </div>
      </section>

      <!-- Profile Section -->
      <section id="profile" class="section">
        <div class="section-header">
          <h2>Mi Perfil</h2>
          <button class="btn-back" onclick="showSection('dashboard')">
            <i class="fas fa-arrow-left"></i> Volver
          </button>
        </div>
        <div class="profile-content">
          <div class="profile-card">
            <div class="profile-header">
              <div class="profile-avatar">
                <i class="fas fa-user"></i>
              </div>
              <div class="profile-info">
                <h3 id="profileName">Cargando...</h3>
                <p id="profileEmail">Cargando...</p>
              </div>
            </div>
            <div class="profile-form">
              <form id="profileForm">
                <div class="form-group">
                  <label for="profileAddress">Dirección</label>
                  <input type="text" id="profileAddress" placeholder="Ingresa tu dirección" />
                </div>
                <div class="form-group">
                  <label for="profilePhone">Teléfono</label>
                  <input type="tel" id="profilePhone" placeholder="Ingresa tu teléfono" />
                </div>
                <div class="form-actions">
                  <button type="button" class="btn-secondary" onclick="resetProfileForm()">
                    Cancelar
                  </button>
                  <button type="submit" class="btn-primary">
                    <i class="fas fa-save"></i> Guardar Cambios
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- New Order Modal -->
    <div id="newOrderModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Nuevo Pedido</h2>
          <button class="close-btn" onclick="closeNewOrderModal()">
            <i class="fas fa-times"></i>
          </button>
        </div>
        <form id="orderForm" class="order-form">
          <div class="form-group">
            <label for="serviceType">Tipo de Servicio</label>
            <select id="serviceType" required>
              <option value="">Selecciona un servicio</option>
              <option value="lavado">Lavado</option>
              <option value="lavado-planchado">Lavado y Planchado</option>
              <option value="zapatos">Lavado de Zapatos</option>
              <option value="hogar">Ropa de Hogar</option>
            </select>
          </div>

          <div class="form-group">
            <label for="weight">Peso Estimado (kg)</label>
            <input type="number" id="weight" min="0.5" step="0.5" required />
          </div>

          <div class="form-group">
            <label for="pickupDate">Fecha de Recogida</label>
            <input type="date" id="pickupDate" required />
          </div>

          <div class="form-group">
            <label for="pickupTime">Hora de Recogida</label>
            <input type="time" id="pickupTime" required />
          </div>

          <div class="form-group">
            <label for="specialInstructions">Instrucciones Especiales</label>
            <textarea
              id="specialInstructions"
              rows="3"
              placeholder="Alguna instrucción especial para tu ropa..."
            ></textarea>
          </div>

          <div class="order-summary">
            <h3>Resumen del Pedido</h3>
            <div id="orderSummary">
              <p>Selecciona un servicio para ver el precio</p>
            </div>
          </div>

          <div class="form-actions">
            <button
              type="button"
              class="btn-secondary"
              onclick="closeNewOrderModal()"
            >
              Cancelar
            </button>
            <button type="submit" class="btn-primary">Crear Pedido</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
      <div class="loading-spinner">
        <i class="fas fa-spinner fa-spin"></i>
        <p>Cargando...</p>
      </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-functions-compat.js"></script>

    <!-- App Config -->
    <script src="/assets/js/config/app-config.js"></script>

    <!-- Firebase Config -->
    <script src="/assets/js/auth/firebase-config.js"></script>

    <!-- Firebase Service -->
    <script src="/firebase-service.js"></script>

    <!-- Dashboard Script -->
    <script src="cliente.js"></script>
  </body>
</html>
